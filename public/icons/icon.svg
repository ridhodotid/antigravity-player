<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Rounded App Icon Frame -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="#1e293b" stroke-width="4" />
  
  <!-- Vinyl Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="2" opacity="0.4" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#334155" stroke-width="2" opacity="0.3" />
  
  <!-- Glowing Music Note & Sound Wave Symbol -->
  <g filter="url(#glow)">
    <path fill="url(#neon-grad)" d="M210 120c0-11 9-20 20-20h90c11 0 20 9 20 20v140c-15-10-34-16-55-16-44 0-80 27-80 60s36 60 80 60 80-27 80-60V180h30c11 0 20-9 20-20s-9-20-20-20h-40c-11 0-20 9-20 20v30h-75v-70z" />
    <circle cx="256" cy="364" r="36" fill="url(#neon-grad)" />
  </g>
  
  <!-- Pulse Accent Wave -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#neon-grad)" stroke-width="6" opacity="0.2" />
</svg>
